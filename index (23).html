<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gelecekteki Eşin Kim?</title>
<style>
:root{--bg:#fff7f3;--card:#fff;--ink:#2b1b1f;--mut:#8a6f75;--acc:#e8365d;--acc2:#ffe3ea;--bd:#f2d9df;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1114;--card:#251a1e;--ink:#f7e9ec;--mut:#b99aa2;--acc:#ff5c80;--acc2:#3a2229;--bd:#3d2a31}}
:root[data-theme="dark"]{--bg:#1a1114;--card:#251a1e;--ink:#f7e9ec;--mut:#b99aa2;--acc:#ff5c80;--acc2:#3a2229;--bd:#3d2a31}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.7rem;line-height:1.2;margin:8px 0}
.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px}
label{display:block;font-size:.9rem;color:var(--mut);margin:12px 0 4px}
input{width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--ink)}
.opt:hover{border-color:var(--acc);background:var(--acc2)}
.bar{height:6px;background:var(--acc2);border-radius:9px;margin-bottom:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{font-size:1.15rem;font-weight:700;margin:0}
.row{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--bd)}
.row:last-of-type{border:0}
.row b{min-width:96px;color:var(--acc)}
.big{font-size:2.4rem;font-weight:800;color:var(--acc);text-align:center;margin:0}
.c{text-align:center;color:var(--mut);margin:0 0 8px}
.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.err{color:var(--acc);font-size:.85rem;margin:10px 0 0;min-height:1em}
.note{font-size:.8rem;color:var(--mut);text-align:center;margin-top:18px}
</style>
</head>
<body>
<main id="app"></main>
<script>
// Özellikler: [Neşeli, Duygusal, Pratik, İçe dönük, Dobra]
var Q=[
{q:"Kendini nasıl tanımlarsın?",o:[["Neşeli ve esprili",[3,0,0,0,1]],["Duygusal ve romantik",[0,3,0,1,0]],["Planlı ve düzenli",[0,0,3,1,0]],["Sessiz ve içe dönük",[0,1,0,3,0]],["Kararlı ve dobra",[1,0,0,0,3]],["Meraklı ve maceracı",[1,0,1,0,2]]]},
{q:"En çok hangi saatte tweet atarsın?",o:[["Sabah (06-09)",[0,0,3,0,0]],["Öğlen (12-14)",[1,0,2,0,0]],["Öğleden sonra (15-18)",[1,0,2,0,1]],["Akşam (19-23)",[1,2,0,0,1]],["Gece yarısından sonra",[0,1,0,3,1]],["Belli bir saatim yok",[1,0,0,1,2]]]},
{q:"En çok ne paylaşırsın?",o:[["Kişisel duygu ve düşünceler",[0,3,0,0,1]],["Komik içerik ve espri",[3,0,0,0,0]],["Siyaset ve gündem",[0,0,0,0,3]],["Spor, müzik, dizi gibi hobiler",[2,0,1,0,1]],["İş ve kariyer",[0,0,3,0,0]],["Hiç paylaşmam, sadece okurum",[0,0,1,3,0]]]},
{q:"Biyografin nasıl?",o:[["Boş",[0,0,0,3,0]],["Tek kelime ya da kısa cümle",[0,0,2,2,0]],["Ağırlıklı emoji",[3,1,0,0,0]],["Mesleğim ve ilgi alanlarım",[0,0,3,0,0]],["Bir alıntı ya da söz",[0,2,0,1,0]],["Uzun bir açıklama",[0,1,0,0,2]]]},
{q:"Konum alanına ne yazdın?",o:[["Yaşadığım şehir",[0,0,3,0,0]],["Sadece ülke",[0,0,2,0,1]],["Boş bıraktım",[0,0,0,3,0]],["Duygusal bir ifade",[0,3,0,0,0]],["Esprili bir yer adı",[3,0,0,1,0]],["Memleketim",[0,2,1,0,1]]]},
{q:"Sana mesaj gelince ne yaparsın?",o:[["Hemen cevap veririm",[1,0,0,0,2]],["Birkaç saat içinde dönerim",[0,0,3,0,0]],["Birkaç gün sonra dönerim",[0,0,0,3,0]],["Uzun ve detaylı yazarım",[0,3,0,0,0]],["Kısa cevap veririm",[0,0,1,1,2]],["Çoğu zaman cevap vermem",[0,0,0,2,2]]]},
{q:"Bir tartışmada ne yaparsın?",o:[["Fikrimi net söylerim",[0,0,0,0,3]],["Konuyu yumuşatırım",[1,2,0,0,0]],["Mantıklı sebepler sıralarım",[0,0,3,0,0]],["Geri çekilirim",[0,1,0,3,0]],["Espriyle geçiştiririm",[3,0,0,0,0]],["Konuşmaktan uzak dururum",[0,0,1,2,0]]]}
];
var N=["Neşeli","Duygusal","Pratik","İçe dönük","Dobra"];
// Eşin tipi, baskın özelliğinin tamamlayıcısıdır
var S=[
{huy:"ciddi, düzenli ve sakin",job:["muhasebeci","noter","bankacı","mühendis"],date:"Sessiz bir kafede kahve",city:["Trabzon","Rize","Adana","Samsun"]},
{huy:"sakin, anlayışlı ve çözüm odaklı",job:["doktor","inşaat mühendisi","psikolog","itfaiyeci"],date:"Sahilde yürüyüş",city:["İzmir","Muğla","Aydın","Antalya"]},
{huy:"spontane, maceracı ve esnek",job:["tur rehberi","müzisyen","fotoğrafçı","pilot"],date:"Daha önce gitmediğiniz bir yerde gezi",city:["Kayseri","Konya","Sivas","Eskişehir"]},
{huy:"konuşkan, sosyal ve açık sözlü",job:["öğretmen","avukat","satış uzmanı","gazeteci"],date:"Kalabalık bir restoranda akşam yemeği",city:["Erzurum","Kars","Mardin","Van"]},
{huy:"sabırlı, soğukkanlı ve uzlaşmacı",job:["hemşire","hakem","arabulucu","psikolojik danışman"],date:"Sakin bir akşam yemeği",city:["Gaziantep","Diyarbakır","Hatay","Bursa"]}
];
var app=document.getElementById("app"),name="",num={},sc=[0,0,0,0,0],i=0;

function hash(s){var h=5381;for(var k=0;k<s.length;k++)h=((h<<5)+h+s.charCodeAt(k))>>>0;return h}
function pick(a,h,k){return a[(h>>>k)%a.length]}
function esc(t){return t.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function start(){
  name="";num={};sc=[0,0,0,0,0];i=0;
  app.innerHTML='<h1>💘 Gelecekteki Eşin Kim?</h1><p class="sub">Kullanıcı adını yaz, birkaç bilgi ver ve 7 soruyu cevapla. Geleceğin eşini ve memleketini tahmin edelim.</p>'+
  '<div class="card"><input id="u" placeholder="@kullanıcıadı" maxlength="30" autocomplete="off"><button class="btn" id="go" disabled>Başlayalım</button></div>'+
  '<p class="note">Eğlence amaçlıdır. Twitter/X\'ten hiçbir veri çekilmez.</p>';
  var u=document.getElementById("u"),g=document.getElementById("go");
  u.oninput=function(){g.disabled=!u.value.replace("@","").trim()};
  u.onkeydown=function(e){if(e.key==="Enter"&&!g.disabled)g.click()};
  g.onclick=function(){name=u.value.replace("@","").trim();g.disabled=true;g.textContent="Kontrol ediliyor...";lookup(function(r){if(r)render(r,true);else numbers()})};
}
function numbers(){
  var f=[["fol","Takipçi sayısı","örn. 350"],["fo","Takip ettiğin sayısı","örn. 420"],["boy","Boyun (cm)","örn. 175"],["kilo","Kilon (kg)","örn. 70"]];
  app.innerHTML='<div class="card"><p class="q">Birkaç rakam</p>'+
  f.map(function(x){return '<label for="'+x[0]+'">'+x[1]+'</label><input id="'+x[0]+'" type="number" inputmode="numeric" min="0" placeholder="'+x[2]+'">'}).join("")+
  '<p class="err" id="er"></p><button class="btn" id="nx">Devam</button></div>';
  document.getElementById("nx").onclick=function(){
    var v={};f.forEach(function(x){v[x[0]]=parseFloat(document.getElementById(x[0]).value)});
    var er=document.getElementById("er");
    if([v.fol,v.fo,v.boy,v.kilo].some(isNaN)){er.textContent="Lütfen dört alanı da doldur.";return}
    if(v.fol<0||v.fo<0){er.textContent="Takipçi ve takip sayısı negatif olamaz.";return}
    if(v.boy<120||v.boy>230){er.textContent="Boy 120-230 cm arasında olmalı.";return}
    if(v.kilo<30||v.kilo>250){er.textContent="Kilo 30-250 kg arasında olmalı.";return}
    num=v;
    // Rakamlardan puan: takipçi/takip oranı ve takipçi büyüklüğü
    var r=v.fo===0?99:v.fol/v.fo;
    if(v.fo===0){sc[3]+=2}else if(r>=2){sc[4]+=2;sc[3]+=1}else if(r>=0.8){sc[2]+=3}else{sc[1]+=2;sc[0]+=1}
    if(v.fol<100)sc[3]+=1;else if(v.fol>=5000){sc[4]+=1;sc[0]+=1}
    i=0;ask();
  };
}
function ask(){
  if(i>=Q.length)return result();
  var q=Q[i];
  app.innerHTML='<div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="card"><p class="q">'+(i+1)+'/'+Q.length+' · '+q.q+'</p>'+
  q.o.map(function(o,k){return '<button class="opt" data-k="'+k+'">'+o[0]+'</button>'}).join("")+'</div>';
  Array.prototype.forEach.call(document.querySelectorAll(".opt"),function(b){
    b.onclick=function(){var w=q.o[+b.dataset.k][1];for(var t=0;t<5;t++)sc[t]+=w[t];i++;ask()}
  });
}
var DB=null;
if(window.claude&&claude.use){claude.use("db").then(function(d){DB=d||null}).catch(function(){})}
function key(){return name.toLowerCase().replace(/[^a-z0-9_]/g,"")||("u"+hash(name))}
function ldGet(){try{return localStorage.getItem("ge:"+key())}catch(e){return null}}
function ldSet(j){try{localStorage.setItem("ge:"+key(),j)}catch(e){}}
function lookup(cb){
  var l=ldGet(),loc=l?JSON.parse(l):null;
  if(!DB)return cb(loc);
  DB.doc("profiles/"+key()).get().then(function(s){cb(s.exists?JSON.parse(s.data().r):loc)},function(){cb(loc)});
}
function save(r,cb){
  var j=JSON.stringify(r);ldSet(j);
  if(!DB)return cb(r,false);
  var d=DB.doc("profiles/"+key());
  d.get().then(function(s){
    if(s.exists){var o=JSON.parse(s.data().r);ldSet(s.data().r);return cb(o,true)}
    return d.set({r:j,at:Date.now()}).then(function(){cb(r,false)});
  }).catch(function(){cb(r,false)});
}
function compute(){
  var h=hash(name.toLowerCase());
  var ord=[0,1,2,3,4].sort(function(a,b){return sc[b]-sc[a]||(((h>>>a)&1)-((h>>>b)&1))||a-b});
  var top=ord[0],sec=ord[1],sp=S[top];
  var job=pick(sp.job,h,2),city=pick(sp.city,h,5);
  var total=sc.reduce(function(a,b){return a+b},0)||1;
  var uyum=Math.min(99,62+Math.round(sc[top]/total*20)+(h%17));
  var yas=(h%7)-3,yasT=yas===0?"Seninle aynı yaşta":(yas>0?yas+" yaş büyük":(-yas)+" yaş küçük");
  var eboy=Math.max(155,Math.min(198,[172,176,179,168,174][top]+(sec-2)*2+((h>>>7)%15)-7));
  var bmi=[22,23,21,22,24][top]+((h>>>9)%4)-1,ekilo=Math.round(bmi*Math.pow(eboy/100,2));
  var boyT=eboy+" cm",kiloT=ekilo+" kg";
  var uyumT="%"+uyum;
  return {n:name,u:uyumT,city:city,job:job,yas:yasT,boy:boyT,kilo:kiloT,huy:sp.huy,date:sp.date,
    prof:"%"+Math.round(sc[top]/total*100)+" "+N[top]+", %"+Math.round(sc[sec]/total*100)+" "+N[sec]};
}
function result(){
  var r=compute();
  save(r,function(rr,existed){render(rr,existed)});
}
function render(r,existed){
  var txt="@"+r.n+" için tahminim: eşin "+r.city+" memleketli bir "+r.job+", uyum "+r.u+" 💘";
  app.innerHTML='<div class="card"><p class="c">@'+esc(r.n)+' için sonuç</p><p class="big">'+esc(r.u)+'</p><p class="c">uyum oranı</p>'+
  (existed?'<p class="c" style="font-size:.85rem">Bu kullanıcı adı için sonuç daha önce kaydedilmiş, aynısı gösteriliyor.</p>':'')+
  [["Memleket",r.city],["Meslek",r.job],["Yaş",r.yas],["Boy",r.boy],["Kilo",r.kilo],["Karakter",r.huy],["İlk buluşma",r.date],["Senin profilin",r.prof]].map(function(x){
    return '<div class="row"><b>'+x[0]+'</b><span>'+esc(String(x[1]))+'</span></div>'}).join("")+'</div>'+
  '<button class="btn" id="cp">Sonucu kopyala</button><button class="btn ghost" id="rs">Başka kullanıcı adı dene</button>';
  document.getElementById("rs").onclick=start;
  document.getElementById("cp").onclick=function(){
    var b=this;
    try{navigator.clipboard.writeText(txt).then(function(){b.textContent="Kopyalandı ✓"},function(){b.textContent=txt})}catch(e){b.textContent=txt}
  };
}
start();
</script>
</body>
</html>
